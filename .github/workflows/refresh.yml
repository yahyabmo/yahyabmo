name: Refresh README

# Every night: a new fractal of the day and fresh numbers, committed by the bot.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [template.md, "scripts/**", package.json]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the new README
        run: |
          git add README.md assets/fractal.jpg assets/stats-dark.svg assets/stats-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "add: fractal of the day $(date -u +%F)"
          git push
